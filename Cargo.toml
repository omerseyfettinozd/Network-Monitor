[package]
name = "network-monitor"
version = "2.0.1"
edition = "2024"
description = "Cross-platform floating real-time network monitor built with Rust and egui"
license = "MIT"
repository = "https://github.com/omerseyfettinozd/Network-Monitor"

[[bin]]
name = "network-monitor"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
sysinfo = { version = "0.33", default-features = false, features = ["network"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
